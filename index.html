<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sorvetada</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Sorvetada</h1>
<div class="row" id="mode"><button data-m="1" aria-pressed="true">1 jogador</button><button data-m="2" aria-pressed="false">2 jogadores (duelo)</button></div>
<div class="row" id="p1row"><b>J1</b></div>
<div class="row" id="p2row" hidden><b>J2</b></div>
<div id="hud"><span id="h1"></span><span id="h2"></span><span id="h3"></span></div>
<canvas id="c" width="600" height="520"></canvas>
<div id="ctl">
<div id="pad">
<span></span><button data-k="u" aria-label="Cima">▲</button><span></span>
<button data-k="l" aria-label="Esquerda">◀</button><button data-k="d" aria-label="Baixo">▼</button><button data-k="r" aria-label="Direita">▶</button>
</div>
<button id="bomb">Soltar cereja</button>
</div>
<p id="help"></p>
<script src="game.js"></script>
</body>
</html>
