<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sorvetada</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9ec">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div id="deco" aria-hidden="true">
  <svg class="d cloud c1" viewBox="0 0 200 80"><g fill="#fff" opacity=".9"><ellipse cx="60" cy="52" rx="50" ry="22"/><circle cx="92" cy="34" r="26"/><circle cx="52" cy="38" r="20"/><ellipse cx="136" cy="54" rx="44" ry="20"/></g></svg>
  <svg class="d cloud c2" viewBox="0 0 200 80"><g fill="#fff" opacity=".8"><ellipse cx="70" cy="52" rx="52" ry="22"/><circle cx="104" cy="36" r="26"/><ellipse cx="146" cy="54" rx="40" ry="18"/></g></svg>
  <svg class="d lolli" viewBox="0 0 120 220"><rect x="54" y="90" width="12" height="130" rx="6" fill="#fff" stroke="#ff7aa8" stroke-width="3"/><circle cx="60" cy="62" r="52" fill="#ffd0e3" stroke="#ff4f81" stroke-width="5"/><path d="M54 62a6 6 0 1 1 12 0a12 12 0 1 1-24 0a18 18 0 1 1 36 0a24 24 0 1 1-48 0a30 30 0 1 1 60 0a36 36 0 1 1-72 0" fill="none" stroke="#ff4f81" stroke-width="7" stroke-linecap="round"/></svg>
  <svg class="d cone coneL" viewBox="0 0 120 240"><path d="M18 120L60 236L102 120Z" fill="#f2b45f" stroke="#b9772f" stroke-width="4" stroke-linejoin="round"/><path d="M34 128L76 214M56 124L90 186M78 124L98 160M86 128L44 214M64 124L30 180" stroke="#d99a4e" stroke-width="3"/><circle cx="60" cy="92" r="50" fill="#ff8fb8" stroke="#d94b84" stroke-width="4"/><path d="M12 88Q60 46 108 88L108 98Q100 118 92 98Q86 88 78 104Q72 128 62 104Q54 88 46 106Q40 122 32 100Q22 94 12 100Z" fill="#6b3d2a"/><g stroke-width="4" stroke-linecap="round"><path d="M40 70l6-2" stroke="#fff"/><path d="M70 62l5 3" stroke="#36b8ff"/><path d="M84 78l6-1" stroke="#ffd23f"/><path d="M54 82l5 3" stroke="#58d68d"/></g><circle cx="60" cy="38" r="13" fill="#e0244f"/><path d="M60 26Q64 12 74 8" stroke="#4f8a3c" stroke-width="3" fill="none"/></svg>
  <svg class="d cone coneR" viewBox="0 0 120 240"><path d="M18 120L60 236L102 120Z" fill="#f2b45f" stroke="#b9772f" stroke-width="4" stroke-linejoin="round"/><path d="M34 128L76 214M56 124L90 186M78 124L98 160M86 128L44 214M64 124L30 180" stroke="#d99a4e" stroke-width="3"/><circle cx="60" cy="92" r="50" fill="#8a5a40" stroke="#5a3322" stroke-width="4"/><path d="M12 88Q60 46 108 88L108 98Q100 118 92 98Q86 88 78 104Q72 128 62 104Q54 88 46 106Q40 122 32 100Q22 94 12 100Z" fill="#fff3e0"/><g stroke-width="4" stroke-linecap="round"><path d="M40 70l6-2" stroke="#ff4f81"/><path d="M70 62l5 3" stroke="#36b8ff"/><path d="M84 78l6-1" stroke="#ffd23f"/><path d="M54 82l5 3" stroke="#58d68d"/></g><circle cx="60" cy="38" r="13" fill="#e0244f"/><path d="M60 26Q64 12 74 8" stroke="#4f8a3c" stroke-width="3" fill="none"/></svg>
</div>
<button id="theme" class="pill"></button>
<section id="menu">
  <div class="logo"><i class="cherry"></i><h1>Sorvetada</h1><p class="tag">Mate os monstros e faça mais pontos!</p></div>
  <div class="row" id="tabs"><button data-t="partida" aria-pressed="true">🎮 Partida</button><button data-t="fases" aria-pressed="false">🗺️ Fases</button></div>
  <div id="tab-partida">
    <div class="row" id="mode"><button data-m="1" aria-pressed="true">👤 1 jogador</button><button data-m="2" aria-pressed="false">👥 2 jogadores (duelo)</button></div>
    <div class="card" id="c1">
      <label><img class="pv" id="pv1" alt=""><input id="n1" maxlength="12" placeholder="Nome do Jogador 1" autocomplete="off"></label>
      <div class="row" id="p1row" aria-label="Escolha o sabor do jogador 1"></div>
    </div>
    <div class="card" id="c2" hidden>
      <label><img class="pv" id="pv2" alt=""><input id="n2" maxlength="12" placeholder="Nome do Jogador 2" autocomplete="off"></label>
      <div class="row" id="p2row" aria-label="Escolha o sabor do jogador 2"></div>
    </div>
    <button id="play">Escolher fase ▶</button>
    <div id="help" class="howto"></div>
  </div>
  <div id="tab-fases" hidden>
    <p class="sub2">Conclua uma fase para liberar a próxima.<br>As concluídas ficam rosa!</p>
    <div id="levels"></div>
    <button id="resetp" class="pill">🗑️ Apagar progresso</button>
  </div>
</section>
<section id="game" hidden>
  <div id="top"><h1>Sorvetada</h1><button id="back" class="pill">← Menu</button></div>
  <div id="hud"><span id="h1"></span><span id="h2"></span><span id="h3"></span></div>
  <div id="pw"></div>
  <div id="frame"><canvas id="c" width="780" height="676"></canvas></div>
  <div id="ctl">
    <div id="joy" aria-label="Direcional analógico"><span class="ch u">▲</span><span class="ch d">▼</span><span class="ch l">◀</span><span class="ch r">▶</span><div id="knob"></div></div>
    <button id="bomb" aria-label="Soltar cereja-bomba"><span>🍒</span><small>Soltar</small></button>
  </div>
</section>
<p id="ver" class="ver">Versão 10 · carregando…</p>
<script src="game.js?v=10"></script>
</body>
</html>
